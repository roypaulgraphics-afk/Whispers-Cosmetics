name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Public HTTPS URL of the deployed POS (overrides the POS_SERVER_URL variable)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Point the wrapper at the POS server
        env:
          SERVER_URL: ${{ inputs.server_url || vars.POS_SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::Set the POS_SERVER_URL repository variable or pass server_url."
            exit 1
          fi
          case "$SERVER_URL" in
            https://*) ;;
            *) echo "::error::POS_SERVER_URL must start with https://"; exit 1 ;;
          esac
          export CAPACITOR_SERVER_URL="$SERVER_URL"
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whispers-cosmetics-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
